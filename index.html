<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DEAD CITY // Outbreak</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="hud">
        <div class="top">
            <b>DEAD CITY</b>
            <span>WAVE <strong id="wave">1</strong></span>
            <span>HOSTILES <strong id="hostiles">0</strong></span>
            <span>KILLS <strong id="kills">0</strong></span>
        </div>

        <div id="crosshair">+</div>

        <div id="healthBox">
            <div>HEALTH <strong id="healthText">100</strong></div>
            <div class="healthBar">
                <div id="healthBar"></div>
            </div>
        </div>

        <div id="ammo">
            <small>M4A1</small>
            <b id="ammoText">30</b>
            <span>/ 150</span>
        </div>

        <div id="message"></div>

        <div id="controls">
            WASD MOVE • SHIFT SPRINT • CLICK SHOOT • R RELOAD
        </div>
    </div>

    <div id="deathScreen">
        <h1>YOU DIED</h1>
        <p id="deathStats"></p>
        <button id="respawn">RESPAWN</button>
    </div>

    <!-- Three.js -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

    <!-- Game -->
    <script src="game.js"></script>

</body>
</html>
